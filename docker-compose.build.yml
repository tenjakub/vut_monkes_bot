# Lokální sestavení image z aktuálního kódu místo stažení z GHCR (vývoj / test před pushem):
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build bot
#
# Watchtower takhle sestavený kontejner ignoruje.

services:
  bot:
    image: vut-monkes-bot:local
    build:
      context: .
      args:
        BOT_VERSION: local
    labels:
      com.centurylinklabs.watchtower.enable: "false"
